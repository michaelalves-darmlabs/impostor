
# Nome do Workflow
name: Deploy to Firebase Hosting

# Gatilho: Executar sempre que houver um push na branch 'main'
on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar ambiente do Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: stable

      - name: Executar flutter build web
        run: flutter build web 

      - name: Implantação no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMPOSTOR }}'
          channelId: live
          projectId: impostor-a1798